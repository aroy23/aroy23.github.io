<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arnav Roy</title>
    <link rel="icon" href="favicon.ico" />
    <style>
      body {
        margin: 0;
        min-height: 100dvh;
        overflow: hidden;
        -webkit-user-select: none;
        user-select: none;
        background: #8000ff;
        color: #ffffff;
        font: 20px "Times New Roman", serif;
      }
      #word { position: fixed; top: 0; left: 0; white-space: nowrap; }
      [hidden] { display: none; }
      button, a {
        display: inline-block;
        padding: 12px 4px;
        border: 0;
        background: none;
        color: inherit;
        font: inherit;
        text-decoration: none;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="word">
      <button id="label">arnav</button>
      <span id="links" hidden>
        <a href="mailto:arnavroy@ucla.edu">email</a>
        <a href="https://www.linkedin.com/in/arnavroy23/" target="_blank" rel="noreferrer">linkedin</a>
      </span>
    </div>
    <script>
      const word = document.getElementById("word");
      const label = document.getElementById("label");
      const links = document.getElementById("links");
      const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)");
      let step = 0, x = innerWidth * 0.38, y = innerHeight * 0.36;
      let vx = 44, vy = 31, last = 0;

      document.addEventListener("click", () => {
        step = (step + 1) % 3;
        label.textContent = step === 0 ? "arnav" : "i'm in nyc";
        label.hidden = step === 2;
        links.hidden = step !== 2;
      });

      function bounce(time) {
        const dt = last ? Math.min((time - last) / 1000, 0.05) : 0;
        last = time;
        if (!reducedMotion.matches) {
          x += vx * dt;
          y += vy * dt;
        }
        const right = Math.max(8, innerWidth - word.offsetWidth - 8);
        const bottom = Math.max(8, innerHeight - word.offsetHeight - 8);
        if (x >= right) vx = -Math.abs(vx);
        if (x <= 8) vx = Math.abs(vx);
        if (y >= bottom) vy = -Math.abs(vy);
        if (y <= 8) vy = Math.abs(vy);
        x = Math.max(8, Math.min(x, right));
        y = Math.max(8, Math.min(y, bottom));
        word.style.transform = `translate(${x}px, ${y}px)`;
        requestAnimationFrame(bounce);
      }
      requestAnimationFrame(bounce);
    </script>
  </body>
</html>
