<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arnav Roy</title>
    <link rel="icon" type="image/png" href="favicon.ico" />
    <style>
      body {
        box-sizing: border-box;
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0;
        padding: 5rem 1.5rem;
        display: grid;
        place-items: center;
        background: #181a19;
        color: #e8e6df;
        color-scheme: dark;
      }

      main {
        max-width: 100%;
      }

      .profile {
        display: grid;
        justify-items: center;
        gap: 1.02rem;
        font-size: 1.2em;
        text-align: center;
      }

      nav {
        display: flex;
        gap: 0.9rem;
      }

      nav a {
        display: grid;
        place-items: center;
        width: 33.6px;
        height: 33.6px;
        color: #b6bbb7;
        text-decoration: none;
      }

      a:hover {
        color: #e8e6df;
      }

      nav svg {
        width: 21.6px;
        height: 21.6px;
      }

      a:focus-visible {
        outline: 1px solid currentColor;
        outline-offset: 5px;
      }

      summary {
        position: fixed;
        top: 1.5rem;
        left: 1.5rem;
        padding: 0.25rem;
        font-size: 1.2em;
        color: #e8e6df;
        cursor: pointer;
        list-style: none;
      }

      summary::-webkit-details-marker {
        display: none;
      }

      summary:focus-visible {
        outline: 1px solid currentColor;
        outline-offset: 5px;
      }

      details:not([open]) {
        position: absolute;
      }

      details[open] + .profile {
        display: none;
      }

      .about-text {
        margin: 0;
        font-size: 1.2em;
        text-align: center;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <main>
      <details>
        <summary>About</summary>
        <p class="about-text">I'm currently in NYC</p>
      </details>
      <section class="profile" aria-label="Arnav Roy's contact information">
        <span>Arnav Roy</span>
        <nav aria-label="Contact">
          <a
            href="mailto:arnavroy@ucla.edu"
            aria-label="Email Arnav Roy"
            title="arnavroy@ucla.edu"
          >
            <svg
              width="21.6"
              height="21.6"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <rect x="3" y="5" width="18" height="14" rx="2" />
              <path d="m4 6 8 6 8-6" />
            </svg>
          </a>
          <a
            href="https://www.linkedin.com/in/arnavroy23/"
            target="_blank"
            rel="noreferrer"
            aria-label="Arnav Roy on LinkedIn"
            title="LinkedIn"
          >
            <svg
              width="21.6"
              height="21.6"
              viewBox="0 0 24 24"
              fill="currentColor"
              aria-hidden="true"
            >
              <path
                d="M5.2 3.8a1.7 1.7 0 1 1 0 3.4 1.7 1.7 0 0 1 0-3.4ZM3.8 9h2.8v11H3.8V9Zm5.1 0h2.7v1.5h.1c.6-1 1.7-1.8 3.3-1.8 3 0 4.1 1.8 4.1 4.8V20h-2.8v-5.8c0-1.7-.3-2.9-1.9-2.9-1.8 0-2.6 1.2-2.6 3.1V20H8.9V9Z"
              />
            </svg>
          </a>
        </nav>
      </section>
    </main>
  </body>
</html>
