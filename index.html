<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arnav Roy</title>
    <link rel="icon" href="favicon.ico?v=2" />
    <style>
      body {
        margin: 0;
        min-height: 100dvh;
        overflow: hidden;
        -webkit-user-select: none;
        user-select: none;
        background: #8000ff;
        color: #ffffff;
        font: 20px "Times New Roman", serif;
      }
      #word { position: fixed; top: 0; left: 0; white-space: nowrap; }
      .letter { display: inline-block; white-space: pre; }
      [hidden] { display: none; }
      button, a {
        display: inline-block;
        padding: 12px 4px;
        border: 0;
        background: none;
        color: inherit;
        font: inherit;
        text-decoration: none;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="word">
      <button id="label">arnav</button>
      <span id="links" hidden>
        <a href="mailto:arnavroy@ucla.edu">email</a>
        <a href="https://www.linkedin.com/in/arnavroy23/" target="_blank" rel="noreferrer">linkedin</a>
      </span>
    </div>
    <script>
      const word = document.getElementById("word");
      const label = document.getElementById("label");
      const links = document.getElementById("links");
      const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)");
      let step = 0, x = innerWidth * 0.38, y = innerHeight * 0.36;
      let vx = 44, vy = 31, last = 0;
      let pointer = null;
      let pointerIsNear = false, wasBent = false, pulse = 0;
      let nameLetters = splitLetters(label);
      const contactLetters = Array.from(links.querySelectorAll("a")).flatMap((link) => splitLetters(link));

      function splitLetters(element, text = element.textContent) {
        element.setAttribute("aria-label", text);
        const letters = Array.from(text, (character) => {
          const letter = document.createElement("span");
          letter.className = "letter";
          letter.textContent = character;
          return letter;
        });
        element.replaceChildren(...letters);
        return letters;
      }

      document.addEventListener("pointermove", (event) => {
        if (event.pointerType !== "touch") pointer = { x: event.clientX, y: event.clientY };
      });
      document.documentElement.addEventListener("pointerleave", () => { pointer = null; });

      document.addEventListener("click", (event) => {
        if (event.target.closest("a")) return;
        step = (step + 1) % 3;
        if (step !== 2) nameLetters = splitLetters(label, step === 0 ? "arnav" : "i'm in nyc");
        label.hidden = step === 2;
        links.hidden = step !== 2;
        pulse = 1;
      });

      function bendLetters(time, dt, width, height) {
        const distance = pointer ? Math.hypot(pointer.x - x - width / 2, pointer.y - y - height / 2) : Infinity;
        const nearby = distance < 105;
        if (nearby && !pointerIsNear) pulse = 1;
        pointerIsNear = nearby;
        pulse = Math.max(0, pulse - dt * 2.2);
        const stretch = reducedMotion.matches ? 0 : pulse * Math.min(1, (1 - pulse) * 8);
        if (!stretch && !wasBent) return;
        wasBent = stretch > 0;

        for (const letters of [nameLetters, contactLetters]) {
          letters.forEach((letter, index) => {
            const wave = Math.sin(time / 120 + index * 1.7);
            const spread = (index - (letters.length - 1) / 2) * stretch * 8;
            letter.style.transform = stretch
              ? `translate(${spread}px, ${wave * stretch * 34}px) skewX(${wave * stretch * 32}deg) scaleY(${1 + stretch * (2 + wave)})`
              : "";
          });
        }
      }

      function bounce(time) {
        const dt = last ? Math.min((time - last) / 1000, 0.05) : 0;
        last = time;
        if (!reducedMotion.matches) {
          x += vx * dt;
          y += vy * dt;
        }
        const width = word.offsetWidth;
        const height = word.offsetHeight;
        const right = Math.max(8, innerWidth - width - 8);
        const bottom = Math.max(8, innerHeight - height - 8);
        if (x < 8 || x > right || y < 8 || y > bottom) pulse = 1;
        if (x >= right) vx = -Math.abs(vx);
        if (x <= 8) vx = Math.abs(vx);
        if (y >= bottom) vy = -Math.abs(vy);
        if (y <= 8) vy = Math.abs(vy);
        x = Math.max(8, Math.min(x, right));
        y = Math.max(8, Math.min(y, bottom));
        word.style.transform = `translate(${x}px, ${y}px)`;
        bendLetters(time, dt, width, height);
        requestAnimationFrame(bounce);
      }
      requestAnimationFrame(bounce);
    </script>
  </body>
</html>
