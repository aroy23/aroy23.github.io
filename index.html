<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arnav Roy</title>
    <link rel="icon" type="image/png" href="favicon.ico" />
    <style>
      body {
        box-sizing: border-box;
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0;
        padding: 1.5rem;
        display: grid;
        place-items: center;
        background: #181a19;
        color: #e8e6df;
        color-scheme: dark;
      }

      main {
        display: grid;
        justify-items: center;
        gap: 1.02rem;
        font-size: 1.2em;
        text-align: center;
      }

      nav {
        display: flex;
        gap: 0.9rem;
      }

      a {
        display: grid;
        place-items: center;
        width: 33.6px;
        height: 33.6px;
        color: #b6bbb7;
        text-decoration: none;
      }

      a:hover {
        color: #e8e6df;
      }

      nav svg {
        width: 21.6px;
        height: 21.6px;
      }

      a:focus-visible {
        outline: 1px solid currentColor;
        outline-offset: 5px;
      }
    </style>
  </head>
  <body>
    <main>
      <span>Arnav Roy</span>
      <nav aria-label="Contact">
        <a
          href="mailto:arnavroy@ucla.edu"
          aria-label="Email Arnav Roy"
          title="arnavroy@ucla.edu"
        >
          <svg
            width="21.6"
            height="21.6"
            viewBox="0 0 24 24"
            fill="currentColor"
            aria-hidden="true"
          >
            <rect width="24" height="24" rx="3.55" />
            <g fill="none" stroke="#181a19" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <rect x="4" y="6" width="16" height="12" rx="1.5" />
              <path d="m4 7 8 6 8-6" />
            </g>
          </svg>
        </a>
        <a
          href="https://www.linkedin.com/in/arnavroy23/"
          target="_blank"
          rel="noreferrer"
          aria-label="Arnav Roy on LinkedIn"
          title="LinkedIn"
        >
          <svg
            width="21.6"
            height="21.6"
            viewBox="0 0 24 24"
            fill="currentColor"
            aria-hidden="true"
          >
            <path
              d="M20.45 0H3.55A3.55 3.55 0 0 0 0 3.55v16.9A3.55 3.55 0 0 0 3.55 24h16.9A3.55 3.55 0 0 0 24 20.45V3.55A3.55 3.55 0 0 0 20.45 0ZM7.15 20.45H3.6V9h3.55ZM5.38 7.44a2.06 2.06 0 1 1 0-4.12 2.06 2.06 0 0 1 0 4.12ZM20.45 20.45H16.9v-5.57c0-1.33-.03-3.04-1.86-3.04-1.85 0-2.13 1.45-2.13 2.94v5.67H9.36V9h3.41v1.56h.05c.48-.9 1.64-1.85 3.37-1.85 3.6 0 4.26 2.37 4.26 5.45Z"
            />
          </svg>
        </a>
      </nav>
    </main>
  </body>
</html>
